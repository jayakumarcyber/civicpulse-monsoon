version: '3.8'

services:
  # 1. PostgreSQL + PostGIS Spatial Database
  db:
    image: postgis/postgis:15-3.3
    container_name: civicpulse_postgis
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse_admin
      POSTGRES_PASSWORD: civicpulse_secret_key
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse_admin -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend & ML Engine Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=civicpulse
      - POSTGRES_USER=civicpulse_admin
      - POSTGRES_PASSWORD=civicpulse_secret_key
      - DATABASE_URL=postgresql+asyncpg://civicpulse_admin:civicpulse_secret_key@db:5432/civicpulse
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Frontend Command Center Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicpulse_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
